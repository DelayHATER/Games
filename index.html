<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>버블버블 스타일 플랫폼 퍼즐 러너</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;700;900&display=swap');
    * { box-sizing: border-box; font-family: 'Jua', 'Noto Sans KR', sans-serif; }
    body { margin: 0; overflow: hidden; background: #09090b; color: white; user-select: none; }
    canvas { display: block; width: 100vw; height: 100vh; image-rendering: pixelated; }
    .control-btn {
      touch-action: manipulation;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }
  </style>
</head>
<body class="flex flex-col items-center justify-between h-screen">

  <div id="uiOverlay" class="absolute top-0 left-0 w-full p-4 sm:p-6 flex justify-between items-center pointer-events-none z-20">
    <div class="flex flex-col gap-2">
      <div class="text-xl sm:text-2xl font-black tracking-wider text-purple-400 drop-shadow flex items-center gap-2">🫧 버블버블 무한 퍼즐 러너</div>
      <div class="flex items-center gap-3 flex-wrap">
        <div class="flex items-center gap-1.5 bg-slate-900/80 px-3 py-1.5 rounded-xl border border-red-500/40">
          <span class="text-xs text-red-400 font-bold">HP</span>
          <div class="w-24 sm:w-32 h-3.5 bg-slate-800 rounded-full overflow-hidden border border-red-500/30">
            <div id="hpBarFill" class="h-full bg-red-500 transition-all duration-200" style="width: 100%;"></div>
          </div>
          <span id="hpText" class="text-xs text-red-300 font-bold ml-1">100/100</span>
        </div>
        <div class="flex items-center gap-1.5 bg-slate-900/80 px-3 py-1.5 rounded-xl border border-cyan-500/40">
          <span class="text-xs text-cyan-400 font-bold">대쉬 쿨타임</span>
          <div class="w-20 sm:w-24 h-3.5 bg-slate-800 rounded-full overflow-hidden border border-cyan-500/30">
            <div id="dashBarFill" class="h-full bg-cyan-400 transition-all duration-100" style="width: 100%;"></div>
          </div>
        </div>
      </div>
      <div id="scoreDisplay" class="text-sm sm:text-base text-amber-200 font-bold">점수: 0점 | 젤리: 0개 | 무한 질주 중</div>
      <div id="distanceDisplay" class="text-xs text-red-400 font-bold">블랙홀과의 거리: 안전함</div>
    </div>
    <div class="flex items-center gap-4 pointer-events-auto">
      <button id="pauseBtn" class="bg-purple-600/90 hover:bg-purple-500 border-2 border-purple-400 px-4 py-2 rounded-xl font-bold transition shadow-lg text-white text-sm sm:text-base">일시정지</button>
    </div>
  </div>

  <div id="gameOverScreen" class="absolute inset-0 bg-black/85 backdrop-blur-md flex flex-col items-center justify-center z-30 hidden p-4 text-center">
    <div class="text-5xl sm:text-6xl font-black text-red-500 mb-2 drop-shadow-[0_0_20px_rgba(239,68,68,0.7)] animate-bounce">게임 오버! 🕳️</div>
    <p id="finalScore" class="text-lg sm:text-xl text-amber-200 mb-2">최종 점수: 0점</p>
    <p id="finalDistance" class="text-base sm:text-lg text-slate-300 mb-6">획득한 젤리: 0개</p>
    <button id="restartBtn" class="bg-purple-500 hover:bg-purple-400 text-slate-950 font-black px-8 py-4 rounded-2xl text-xl shadow-xl transition transform hover:scale-105 active:scale-95">다시 도전하기</button>
  </div>

  <div id="startScreen" class="absolute inset-0 bg-gradient-to-b from-indigo-950 via-purple-950 to-slate-950 backdrop-blur-md flex flex-col items-center justify-center z-30 text-center p-6">
    <div class="text-6xl sm:text-7xl mb-4 animate-bounce">🦖🫧⚡</div>
    <h1 class="text-3xl sm:text-5xl font-black mb-3 text-purple-300 drop-shadow">버블버블 무한 퍼즐 러너</h1>
    <p class="text-slate-200 max-w-lg mb-8 text-sm sm:text-lg leading-relaxed">
      <b>[A / D 또는 하단 좌우 이동버튼]</b>: 좌우 이동<br>
      <b>[W / 스페이스바 / 점프버튼]</b>: 점프<br>
      <b>[Shift / J 또는 대쉬버튼]</b>: 순간 대쉬 (무적 돌진!)<br>
      날아오는 장애물과 바닥 함정을 피해 무한 스테이지를 질주하세요!
    </p>
    <button id="startBtn" class="bg-purple-500 hover:bg-purple-400 text-white font-black px-10 py-5 rounded-2xl text-2xl shadow-2xl transition transform hover:scale-105 active:scale-95 animate-pulse">모험 시작하기!</button>
  </div>

  <div id="mobileControls" class="absolute bottom-4 left-4 right-4 flex justify-between items-center pointer-events-auto z-20 md:hidden">
    <div class="flex gap-2">
      <button id="leftBtn" class="control-btn bg-purple-600/80 active:bg-purple-400 text-white font-black px-6 py-5 rounded-2xl text-xl shadow-lg border-2 border-purple-300">⬅️</button>
      <button id="rightBtn" class="control-btn bg-purple-600/80 active:bg-purple-400 text-white font-black px-6 py-5 rounded-2xl text-xl shadow-lg border-2 border-purple-300">➡️</button>
    </div>
    <div class="flex gap-2">
      <button id="dashMobBtn" class="control-btn bg-cyan-600/80 active:bg-cyan-400 text-white font-black px-5 py-5 rounded-2xl text-lg shadow-lg border-2 border-cyan-300">⚡ 대쉬</button>
      <button id="jumpBtn" class="control-btn bg-indigo-600/80 active:bg-indigo-400 text-white font-black px-6 py-5 rounded-2xl text-lg shadow-lg border-2 border-indigo-300">⬆️ 점프</button>
    </div>
  </div>

  <canvas id="gameCanvas"></canvas>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();

    let gameState = "START";
    let score = 0;
    let jelliesCollected = 0;
    let cameraX = 0;
    let maxGeneratedX = 0;

    let player = {
      x: 200,
      y: 400,
      width: 40,
      height: 48,
      vx: 0,
      vy: 0,
      baseSpeed: 5.5,
      speed: 5.5,
      jumpForce: 13,
      gravity: 0.55,
      isGrounded: false,
      facing: 1,
      hp: 100,
      maxHp: 100,
      isDashing: false,
      dashCooldown: 0,
      dashTimer: 0,
      slowTimer: 0
    };

    let blackHole = {
      x: -400,
      y: canvas.height / 2,
      radius: 120,
      speed: 4.2, // 블랙홀 기본 속도 상향
      gravityPullDistance: 650, // 중력 영향 범위 확대
      maxPullForce: 9.5 // 빨아당기는 힘 강화
    };

    let platforms = [];
    let jellies = [];
    let obstacles = [];
    let flyingProjectiles = [];

    let keys = { left: false, right: false, jump: false, dash: false };

    let synth = null;
    function initAudio() {
      if (!synth) {
        synth = new Tone.Synth({
          oscillator: { type: "triangle" },
          envelope: { attack: 0.005, decay: 0.1, sustain: 0.1, release: 0.3 }
        }).toDestination();
      }
    }

    function playSound(note = "C5", duration = "8n") {
      try {
        initAudio();
        Tone.start();
        synth.triggerAttackRelease(note, duration);
      } catch (e) {}
    }

    function resetGame() {
      player.x = 150;
      player.y = canvas.height - 250;
      player.vx = 0;
      player.vy = 0;
      player.hp = 100;
      player.dashCooldown = 0;
      player.dashTimer = 0;
      player.slowTimer = 0;
      score = 0;
      jelliesCollected = 0;
      cameraX = 0;
      blackHole.x = -450;
      blackHole.y = canvas.height / 2;
      maxGeneratedX = 0;

      platforms = [];
      jellies = [];
      obstacles = [];
      flyingProjectiles = [];

      generateWorldChunk(0, 4000);
      maxGeneratedX = 4000;
    }

    function generateWorldChunk(startX, endX) {
      let currentX = startX;
      let currentY = canvas.height - 150;

      if (currentX === 0) {
        platforms.push({ x: 0, y: canvas.height - 120, width: 1000, height: 40 });
        currentX = 1000;
      }

      while (currentX < endX) {
        let pWidth = Math.random() * 180 + 160;
        let pHeight = 28;
        
        let heightDelta = (Math.random() - 0.45) * 200; 
        currentY += heightDelta;
        
        if (currentY > canvas.height - 150) currentY = canvas.height - 150;
        if (currentY < 180) currentY = 180;

        let pX = currentX + Math.random() * 80 + 30;

        platforms.push({ x: pX, y: currentY, width: pWidth, height: pHeight });

        if (Math.random() > 0.15) {
          jellies.push({ x: pX + pWidth / 2, y: currentY - 35, collected: false, radius: 14 });
        }

        if (Math.random() > 0.55 && pWidth > 200) {
          obstacles.push({ x: pX + pWidth / 3, y: currentY - 30, width: 30, height: 30 });
        }

        currentX = pX + pWidth;
      }
    }

    window.addEventListener("keydown", (e) => {
      if (e.code === "ArrowLeft" || e.code === "KeyA") keys.left = true;
      if (e.code === "ArrowRight" || e.code === "KeyD") keys.right = true;
      if (e.code === "ArrowUp" || e.code === "KeyW" || e.code === "Space") {
        e.preventDefault();
        if (player.isGrounded && gameState === "PLAYING") {
          player.vy = -player.jumpForce;
          player.isGrounded = false;
          playSound("E5", "8n");
        }
      }
      if ((e.code === "ShiftLeft" || e.code === "ShiftRight" || e.code === "KeyJ") && gameState === "PLAYING") {
        triggerDash();
      }
    });

    window.addEventListener("keyup", (e) => {
      if (e.code === "ArrowLeft" || e.code === "KeyA") keys.left = false;
      if (e.code === "ArrowRight" || e.code === "KeyD") keys.right = false;
    });

    function triggerDash() {
      if (player.dashCooldown <= 0 && !player.isDashing) {
        player.isDashing = true;
        player.dashTimer = 18;
        player.dashCooldown = 120;
        playSound("A5", "8n");
      }
    }

    const leftBtn = document.getElementById("leftBtn");
    const rightBtn = document.getElementById("rightBtn");
    const jumpBtn = document.getElementById("jumpBtn");
    const dashMobBtn = document.getElementById("dashMobBtn");

    leftBtn.addEventListener("pointerdown", (e) => { e.preventDefault(); keys.left = true; });
    leftBtn.addEventListener("pointerup", (e) => { e.preventDefault(); keys.left = false; });
    leftBtn.addEventListener("pointerleave", (e) => { e.preventDefault(); keys.left = false; });

    rightBtn.addEventListener("pointerdown", (e) => { e.preventDefault(); keys.right = true; });
    rightBtn.addEventListener("pointerup", (e) => { e.preventDefault(); keys.right = false; });
    rightBtn.addEventListener("pointerleave", (e) => { e.preventDefault(); keys.right = false; });

    dashMobBtn.addEventListener("pointerdown", (e) => { e.preventDefault(); triggerDash(); });

    jumpBtn.addEventListener("pointerdown", (e) => {
      e.preventDefault();
      if (player.isGrounded && gameState === "PLAYING") {
        player.vy = -player.jumpForce;
        player.isGrounded = false;
        playSound("E5", "8n");
      }
    });

    document.getElementById("startBtn").addEventListener("click", () => {
      playSound("C5", "4n");
      resetGame();
      gameState = "PLAYING";
      document.getElementById("startScreen").classList.add("hidden");
    });

    document.getElementById("restartBtn").addEventListener("click", () => {
      playSound("G5", "4n");
      resetGame();
      gameState = "PLAYING";
      document.getElementById("gameOverScreen").classList.add("hidden");
    });

    const pauseBtn = document.getElementById("pauseBtn");
    pauseBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      if (gameState === "PLAYING") {
        gameState = "PAUSED";
        pauseBtn.textContent = "계속하기";
      } else if (gameState === "PAUSED") {
        gameState = "PLAYING";
        pauseBtn.textContent = "일시정지";
      }
    });

    function update(dt) {
      if (gameState !== "PLAYING") return;

      if (player.dashCooldown > 0) player.dashCooldown--;
      if (player.slowTimer > 0) player.slowTimer--;

      if (player.dashTimer > 0) {
        player.dashTimer--;
        if (player.dashTimer === 0) {
          player.isDashing = false;
        }
      }

      let currentSpeed = player.baseSpeed;
      if (player.isDashing) {
        currentSpeed = player.baseSpeed * 2.8;
      } else if (player.slowTimer > 0) {
        currentSpeed = player.baseSpeed * 0.45;
      }

      player.vx = 0;
      if (keys.left) {
        player.vx = -currentSpeed;
        player.facing = -1;
      }
      if (keys.right) {
        player.vx = currentSpeed;
        player.facing = 1;
      }
      if (player.isDashing) {
        player.vx = player.facing * currentSpeed;
      }

      player.x += player.vx;
      if (player.x < 0) player.x = 0;

      if (player.x + 3500 > maxGeneratedX) {
        generateWorldChunk(maxGeneratedX, maxGeneratedX + 3500);
        maxGeneratedX += 3500;
      }

      if (!player.isDashing) {
        player.vy += player.gravity;
      } else {
        player.vy = 0;
      }
      player.y += player.vy;
      player.isGrounded = false;

      platforms.forEach(p => {
        if (
          player.x + player.width > p.x &&
          player.x < p.x + p.width &&
          player.y + player.height >= p.y &&
          player.y + player.height - player.vy <= p.y + 12 &&
          player.vy >= 0
        ) {
          player.y = p.y - player.height;
          player.vy = 0;
          player.isGrounded = true;
        }
      });

      if (player.y > canvas.height + 100) {
        player.hp -= 30;
        player.y = canvas.height - 250;
        player.x -= 150;
        playSound("C3", "4n");
      }

      if (Math.random() < 0.022) {
        let missileY = player.y + (Math.random() - 0.5) * 220;
        flyingProjectiles.push({
          x: player.x + canvas.width / 2 + 300,
          y: missileY,
          vx: -(Math.random() * 3 + 6),
          width: 32,
          height: 16
        });
      }

      for (let i = flyingProjectiles.length - 1; i >= 0; i--) {
        let proj = flyingProjectiles[i];
        proj.x += proj.vx;

        if (
          !player.isDashing &&
          player.x < proj.x + proj.width &&
          player.x + player.width > proj.x &&
          player.y < proj.y + proj.height &&
          player.y + player.height > proj.y
        ) {
          player.hp -= 15;
          player.slowTimer = 90;
          flyingProjectiles.splice(i, 1);
          playSound("C2", "8n");
          continue;
        }

        if (proj.x < cameraX - 200) {
          flyingProjectiles.splice(i, 1);
        }
      }

      // 블랙홀 이동 및 X, Y 좌표 추적
      blackHole.speed = 3.2 + Math.floor(player.x / 1000) * 0.3;
      blackHole.x += blackHole.speed;
      
      let targetBlackHoleY = player.y + player.height / 2;
      blackHole.y += (targetBlackHoleY - blackHole.y) * 0.05;

      let dx = player.x - blackHole.x;
      let dy = (player.y + player.height / 2) - blackHole.y;
      let distanceToPlayer = Math.sqrt(dx * dx + dy * dy);

      document.getElementById("distanceDisplay").textContent = `블랙홀과의 거리: ${Math.max(0, Math.floor(distanceToPlayer))}m`;

      // 블랙홀 중력: 블랙홀이 왼쪽에 있으므로 플레이어를 왼쪽(블랙홀 방향)으로 당김 (+ 방향으로 X좌표를 당기거나 플레이어 좌표를 블랙홀 쪽으로 깎음)
      if (distanceToPlayer < blackHole.gravityPullDistance && !player.isDashing) {
        let pullFactor = 1 - (distanceToPlayer / blackHole.gravityPullDistance);
        pullFactor = Math.max(0, Math.min(1, pullFactor));
        pullFactor = pullFactor * pullFactor;

        // 플레이어가 블랙홀보다 오른쪽에 있으므로 X좌표를 왼쪽으로 끌어당김 (- 방향)
        player.x -= pullFactor * blackHole.maxPullForce;
        player.y += (blackHole.y - (player.y + player.height / 2)) * pullFactor * 0.1;
      }

      if (distanceToPlayer <= 60 || player.hp <= 0) {
        gameState = "GAMEOVER";
        document.getElementById("finalScore").textContent = `최종 점수: ${Math.floor(player.x)}점`;
        document.getElementById("finalDistance").textContent = `획득한 젤리: ${jelliesCollected}개`;
        document.getElementById("gameOverScreen").classList.remove("hidden");
        playSound("A2", "2n");
        return;
      }

      let targetCameraX = player.x - canvas.width / 3;
      cameraX += (targetCameraX - cameraX) * 0.1;
      if (cameraX < 0) cameraX = 0;

      jellies.forEach(j => {
        if (!j.collected) {
          let jdx = (player.x + player.width / 2) - j.x;
          let jdy = (player.y + player.height / 2) - j.y;
          let dist = Math.sqrt(jdx * jdx + jdy * jdy);
          if (dist < player.width / 2 + j.radius) {
            j.collected = true;
            jelliesCollected++;
            score += 500;
            if (player.hp < player.maxHp) player.hp = Math.min(player.maxHp, player.hp + 10);
            playSound("B5", "16n");
          }
        }
      });

      obstacles.forEach(obs => {
        if (
          !player.isDashing &&
          player.x < obs.x + obs.width &&
          player.x + player.width > obs.x &&
          player.y < obs.y + obs.height &&
          player.y + player.height > obs.y
        ) {
          player.hp -= 10;
          player.slowTimer = 90;
          player.x -= 40;
          playSound("C3", "8n");
        }
      });

      let hpPercent = Math.max(0, (player.hp / player.maxHp) * 100);
      document.getElementById("hpBarFill").style.width = `${hpPercent}%`;
      document.getElementById("hpText").textContent = `${Math.max(0, Math.floor(player.hp))}/${player.maxHp}`;

      let dashPercent = Math.max(0, ((120 - player.dashCooldown) / 120) * 100);
      document.getElementById("dashBarFill").style.width = `${dashPercent}%`;

      document.getElementById("scoreDisplay").textContent = `점수: ${Math.floor(player.x)}점 | 젤리: ${jelliesCollected}개 | 무한 질주 중`;
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      ctx.save();
      ctx.translate(-cameraX, 0);

      let bgGrad = ctx.createLinearGradient(0, 0, 0, canvas.height);
      bgGrad.addColorStop(0, "#1e1b4b");
      bgGrad.addColorStop(0.5, "#311042");
      bgGrad.addColorStop(1, "#09090b");
      ctx.fillStyle = bgGrad;
      ctx.fillRect(cameraX, 0, canvas.width, canvas.height);

      platforms.forEach(p => {
        if (p.x + p.width > cameraX && p.x < cameraX + canvas.width) {
          ctx.fillStyle = "#7c3aed";
          ctx.beginPath();
          ctx.roundRect(p.x, p.y, p.width, p.height, 8);
          ctx.fill();
          ctx.strokeStyle = "#c084fc";
          ctx.lineWidth = 3;
          ctx.stroke();
        }
      });

      jellies.forEach(j => {
        if (!j.collected && j.x + j.radius > cameraX && j.x - j.radius < cameraX + canvas.width) {
          ctx.fillStyle = "#facc15";
          ctx.beginPath();
          ctx.arc(j.x, j.y, j.radius, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = "#fef08a";
          ctx.lineWidth = 3;
          ctx.stroke();

          ctx.fillStyle = "rgba(255,255,255,0.8)";
          ctx.beginPath();
          ctx.arc(j.x - 4, j.y - 4, 4, 0, Math.PI * 2);
          ctx.fill();
        }
      });

      obstacles.forEach(obs => {
        if (obs.x + obs.width > cameraX && obs.x < cameraX + canvas.width) {
          ctx.fillStyle = "#ef4444";
          ctx.beginPath();
          ctx.roundRect(obs.x, obs.y, obs.width, obs.height, 6);
          ctx.fill();
          ctx.strokeStyle = "#fca5a5";
          ctx.lineWidth = 2;
          ctx.stroke();
        }
      });

      flyingProjectiles.forEach(proj => {
        ctx.fillStyle = "#f97316";
        ctx.beginPath();
        ctx.roundRect(proj.x, proj.y, proj.width, proj.height, 4);
        ctx.fill();
        ctx.strokeStyle = "#fef08a";
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.fillStyle = "#ef4444";
        ctx.fillRect(proj.x + proj.width, proj.y + 4, 8, 8);
      });

      // 블랙홀 렌더링
      ctx.save();
      ctx.translate(blackHole.x, blackHole.y);
      
      let gradient = ctx.createRadialGradient(0, 0, 10, 0, 0, blackHole.radius);
      gradient.addColorStop(0, "#000000");
      gradient.addColorStop(0.4, "#4c1d95");
      gradient.addColorStop(0.8, "#8b5cf6");
      gradient.addColorStop(1, "transparent");
      
      ctx.fillStyle = gradient;
      ctx.beginPath();
      ctx.arc(0, 0, blackHole.radius, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = "#e879f9";
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.arc(0, 0, blackHole.radius * 0.7, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();

      ctx.save();
      if (player.isDashing) {
        ctx.shadowColor = "#38bdf8";
        ctx.shadowBlur = 25;
      }
      if (player.slowTimer > 0) {
        ctx.fillStyle = "#cbd5e1";
      } else {
        ctx.fillStyle = player.isDashing ? "#38bdf8" : "#0ea5e9";
      }

      ctx.beginPath();
      ctx.roundRect(player.x, player.y, player.width, player.height, 12);
      ctx.fill();
      ctx.strokeStyle = "#bae6fd";
      ctx.lineWidth = 3;
      ctx.stroke();

      ctx.fillStyle = "#ffffff";
      ctx.fillRect(player.facing > 0 ? player.x + 22 : player.x + 6, player.y + 10, 10, 12);
      ctx.fillStyle = "#0f172a";
      ctx.fillRect(player.facing > 0 ? player.x + 28 : player.x + 10, player.y + 13, 4, 6);

      ctx.restore();

      ctx.restore();
    }

    let lastTime = performance.now();
    function gameLoop(time) {
      let dt = (time - lastTime) / 1000;
      if (dt > 0.1) dt = 0.1;
      lastTime = time;

      update(dt);
      draw();
      requestAnimationFrame(gameLoop);
    }

    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
